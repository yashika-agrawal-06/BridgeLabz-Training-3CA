<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Various button styles with hover and active effects</p>
    </header>

    <main>
        <section class="buttons-container">
            <h2>Primary Buttons</h2>
            <div class="button-group">
                <button class="btn btn-primary">Primary Button</button>
                <button class="btn btn-primary">Hover Me</button>
                <button class="btn btn-primary">Click Me</button>
            </div>

            <h2>Secondary Buttons</h2>
            <div class="button-group">
                <button class="btn btn-secondary">Secondary Button</button>
                <button class="btn btn-secondary">Hover Me</button>
                <button class="btn btn-secondary">Click Me</button>
            </div>

            <h2>Outline Buttons</h2>
            <div class="button-group">
                <button class="btn btn-outline">Outline Button</button>
                <button class="btn btn-outline">Hover Me</button>
                <button class="btn btn-outline">Click Me</button>
            </div>

            <h2>Disabled Buttons</h2>
            <div class="button-group">
                <button class="btn btn-primary" disabled>Disabled Primary</button>
                <button class="btn btn-secondary" disabled>Disabled Secondary</button>
                <button class="btn btn-outline" disabled>Disabled Outline</button>
            </div>

            <h2>Size Variations</h2>
            <div class="button-group">
                <button class="btn btn-primary btn-small">Small</button>
                <button class="btn btn-primary btn-medium">Medium</button>
                <button class="btn btn-primary btn-large">Large</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Assignment 8 - Question 5</p>
    </footer>
</body>
</html>
