<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
    <header>
        <h1>User Interface Components</h1>
        <p>Modern UI with consistent styling</p>
    </header>

    <main>
        <div class="card">
            <h2>UI Components Demo</h2>
            
            <!-- Search Bar -->
            <div class="component-section">
                <label for="search">Search Bar:</label>
                <div class="search-container">
                    <input type="text" id="search" class="search-bar" placeholder="Search...">
                    <button class="search-btn">🔍</button>
                </div>
            </div>

            <!-- Buttons -->
            <div class="component-section">
                <label>Buttons:</label>
                <div class="button-group">
                    <button class="btn btn-primary">Submit</button>
                    <button class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-success">Save</button>
                </div>
            </div>

            <!-- Dropdown Menu -->
            <div class="component-section">
                <label for="dropdown">Dropdown Menu:</label>
                <div class="dropdown">
                    <button class="dropdown-btn">Options ▼</button>
                    <div class="dropdown-content">
                        <a href="#">Option 1</a>
                        <a href="#">Option 2</a>
                        <a href="#">Option 3</a>
                        <a href="#">Option 4</a>
                    </div>
                </div>
            </div>

            <!-- Input Field -->
            <div class="component-section">
                <label for="email">Email Input:</label>
                <input type="email" id="email" class="input-field" placeholder="Enter your email">
            </div>

            <!-- Text Area -->
            <div class="component-section">
                <label for="message">Message:</label>
                <textarea id="message" class="textarea-field" placeholder="Enter your message" rows="4"></textarea>
            </div>

            <!-- Toggle/Checkbox -->
            <div class="component-section">
                <label class="checkbox-label">
                    <input type="checkbox" class="checkbox">
                    <span>Remember me</span>
                </label>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Assignment 8 - Question 7</p>
    </footer>
</body>
</html>
