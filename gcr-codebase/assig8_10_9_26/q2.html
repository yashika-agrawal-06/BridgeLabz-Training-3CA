<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <header>
        <h1>Tooltip Demonstration Page</h1>
        <p>Hover over elements to see CSS tooltips</p>
    </header>

    <main>
        <section class="tooltips-container">
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">📧 Email</span>
                <div class="tooltip">contact@example.com</div>
            </div>

            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">📱 Phone</span>
                <div class="tooltip">+1 (555) 123-4567</div>
            </div>

            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">📍 Location</span>
                <div class="tooltip">New York, USA</div>
            </div>

            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">⭐ Rating</span>
                <div class="tooltip">4.8/5 Stars</div>
            </div>

            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">🔐 Security</span>
                <div class="tooltip">256-bit Encrypted</div>
            </div>

            <div class="tooltip-wrapper">
                <span class="tooltip-trigger">⚡ Speed</span>
                <div class="tooltip">Ultra-fast Performance</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Assignment 8 - Question 2</p>
    </footer>
</body>
</html>
