<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Image Showcase Layout</h1>
        <p>Hover over images to see the effects</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+1" alt="Gallery Image 1">
                <figcaption>Beautiful Landscape 1</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+2" alt="Gallery Image 2">
                <figcaption>Scenic Mountain View</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+3" alt="Gallery Image 3">
                <figcaption>Ocean Sunset</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+4" alt="Gallery Image 4">
                <figcaption>Forest Trail</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+5" alt="Gallery Image 5">
                <figcaption>Desert Dunes</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://via.placeholder.com/300x200?text=Image+6" alt="Gallery Image 6">
                <figcaption>Northern Lights</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Assignment 8 - Question 3</p>
    </footer>
</body>
</html>
