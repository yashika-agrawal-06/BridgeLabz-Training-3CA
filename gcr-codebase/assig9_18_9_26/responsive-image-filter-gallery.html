<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css" />
</head>
<body>
  <header>
    <h1>My Image Filter Gallery</h1>
  </header>

  <main>
    <section class="gallery-container" aria-label="Image filter gallery">
      <article class="gallery-item">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain view" class="filter-blur" />
        <p class="caption">Blur Filter</p>
      </article>

      <article class="gallery-item">
        <img src="https://picsum.photos/id/1016/400/300" alt="Canyon path" class="filter-grayscale" />
        <p class="caption">Grayscale Filter</p>
      </article>

      <article class="gallery-item">
        <img src="https://picsum.photos/id/1025/400/300" alt="Dog portrait" class="filter-sepia" />
        <p class="caption">Sepia Filter</p>
      </article>

      <article class="gallery-item">
        <img src="https://picsum.photos/id/1039/400/300" alt="Waterfall" class="filter-brightness" />
        <p class="caption">Brightness Filter</p>
      </article>

      <article class="gallery-item">
        <img src="https://picsum.photos/id/1043/400/300" alt="Forest path" class="filter-contrast" />
        <p class="caption">Contrast Filter</p>
      </article>

      <article class="gallery-item">
        <img src="https://picsum.photos/id/1050/400/300" alt="Coastal view" class="filter-hue" />
        <p class="caption">Hue-Rotate Filter</p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Web Development Assignment</p>
  </footer>
</body>
</html>
