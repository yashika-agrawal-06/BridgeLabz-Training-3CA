<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards-with-animation.css" />
</head>
<body>
  <main class="card-row">
    <article class="profile-card">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Profile one" />
      <div class="card-text">
        <h3>Asha</h3>
        <p>Creative designer with a love for responsive layouts.</p>
      </div>
    </article>

    <article class="profile-card">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Profile two" />
      <div class="card-text">
        <h3>Rahul</h3>
        <p>UI developer focused on elegant user experiences.</p>
      </div>
    </article>

    <article class="profile-card">
      <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=600&q=80" alt="Profile three" />
      <div class="card-text">
        <h3>Meera</h3>
        <p>Frontend specialist blending visual design and code.</p>
      </div>
    </article>
  </main>
</body>
</html>
