<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css" />
</head>
<body>
  <main class="comparison-container">
    <figure class="image-box">
      <img src="https://picsum.photos/id/1035/500/350" alt="Original landscape" />
      <figcaption>Before</figcaption>
    </figure>

    <figure class="image-box altered">
      <img src="https://picsum.photos/id/1035/500/350" alt="Filtered landscape" />
      <figcaption>After</figcaption>
    </figure>
  </main>
</body>
</html>
