<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">

  <header class="container text-center mt-5 mb-4">
    <h1 class="display-5 fw-bold mb-2">Yashika Agrawal</h1>
    <p class="lead text-secondary">Front-End Developer & UI/UX Designer</p>
  </header>

  <main class="container">
    <!-- Profile Image Section -->
    <div class="text-center mb-4">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTavjS3OtHKLdv0i_337XSQvA0ZboazFiVr0lftom0Ewg&s" alt="Alex Morgan Profile" class="img-fluid rounded-circle border border-3 border-secondary p-1">
    </div>

    <!-- Action Buttons -->
    <div class="text-center mb-5">
      <button class="btn btn-primary me-2 px-4 py-2">Hire Me</button>
      <button class="btn btn-outline-dark px-4 py-2">Download CV</button>
    </div>

    <!-- Contact Form Card -->
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow-sm bg-white border-0">
          <h2 class="h4 text-center mb-3">Send Message</h2>
          <form>
            <div class="mb-3">
              <label class="form-label font-weight-bold">Your Name</label>
              <input type="text" class="form-control" placeholder="Enter full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="3" placeholder="Write message..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 mt-5 text-muted">
    <p>&copy; 2026 Alex Morgan. Built with Bootstrap 5.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
