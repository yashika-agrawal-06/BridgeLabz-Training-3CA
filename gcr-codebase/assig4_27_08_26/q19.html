<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 19: Form Security</title>
</head>
<body>
    <h1>Secure Information Form</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="secret">Secret Answer:</label>
        <input type="password" id="secret" name="secret" required>
        <br>
        <button type="submit">Submit</button>
    </form>
    <p>Turning off autocomplete can prevent browsers from storing sensitive form information on shared devices.</p>
</body>
</html>
