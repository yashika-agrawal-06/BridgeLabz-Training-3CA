<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7: Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <!-- A CSRF token helps verify that a form request came from the intended website. -->
    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <input type="hidden" name="csrf-token" value="dummy-csrf-token">
        <br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
