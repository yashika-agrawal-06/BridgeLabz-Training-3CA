<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 17: Form</title>
</head>
<body>
    <h1>Submit a Form</h1>
    <form action="result.html" method="get" target="result-frame">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" required>
        <button type="submit">Submit</button>
    </form>
    <iframe src="about:blank" name="result-frame" width="100%" height="150" title="Submission Result"></iframe>
</body>
</html>
