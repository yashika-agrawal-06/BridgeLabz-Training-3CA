<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the page title shown in the browser tab. -->
    <title>Question 20: Important Head Elements</title>
    <!-- Defines the character encoding used by the document. -->
    <meta charset="UTF-8">
    <!-- Describes the page for search engines and previews. -->
    <meta name="description" content="A page demonstrating important HTML head elements.">
    <!-- Identifies the author of the page. -->
    <meta name="author" content="Yashika">
    <!-- Sets the base URL used for relative links. -->
    <base href="https://example.com/">
    <!-- Links the page to a favicon or other external resource. -->
    <link rel="icon" href="favicon.ico">
    <!-- An empty style element is included to demonstrate the tag. -->
    <style></style>
    <!-- An empty script element is included to demonstrate the tag. -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements</h1>
</body>
</html>
