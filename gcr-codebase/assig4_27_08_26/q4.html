<!DOCTYPE html>

<head>
    <title>Question 4: Frameset</title>

<!-- Frameset splitting the screen: Top (20%) for navigation, Bottom (80%) for content -->
<frameset rows="20%, 80%">
    <frame src="nav.html" name="top_nav" title="Navigation Links">
    <frame src="welcome.html" name="bottom_content" title="Welcome to My Website">
</frameset>
</html>
