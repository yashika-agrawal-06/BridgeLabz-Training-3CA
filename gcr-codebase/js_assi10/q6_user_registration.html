<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q6 - User Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="q6_user_registration.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    #status-msg { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>User Registration</h1>
  </header>

  <main>
    <form id="register-form">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Enter your full name">
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="Try ananya@gmail.com to test duplicate check">
      </div>

      <button type="submit">Register</button>
    </form>

    <p id="status-msg" role="status"></p>
  </main>
</body>
</html>
