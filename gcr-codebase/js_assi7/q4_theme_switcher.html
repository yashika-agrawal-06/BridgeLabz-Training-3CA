<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 4</title>
  <style>
    body { transition: background 0.3s, color 0.3s; }
    body[data-theme="light"] { background: #fff; color: #000; }
    body[data-theme="dark"] { background: #333; color: #fff; }
    body[data-theme="blue"] { background: #003366; color: #fff; }
  </style>
</head>
<body>
  <button class="theme-btn" data-target-theme="light">Light</button>
  <button class="theme-btn" data-target-theme="dark">Dark</button>
  <button class="theme-btn" data-target-theme="blue">Blue</button>

  <script src="q4_theme_switcher.js" defer></script>
</body>
</html>
