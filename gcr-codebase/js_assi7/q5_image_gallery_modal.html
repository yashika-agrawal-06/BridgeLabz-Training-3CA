<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 5</title>
  <style>
    .gallery { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; }
    .gallery img { width: 100px; height: 100px; cursor: pointer; object-fit: cover; }
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    #modal img { max-width: 80%; max-height: 80%; }
  </style>
</head>
<body>
  <div class="gallery" id="gallery">
    <img src="https://via.placeholder.com/150/FF0000" alt="Red" />
    <img src="https://via.placeholder.com/150/00FF00" alt="Green" />
    <img src="https://via.placeholder.com/150/0000FF" alt="Blue" />
  </div>

  <div id="modal">
    <img id="modalImg" src="" alt="Preview" />
  </div>

  <script src="q5_image_gallery_modal.js" defer></script>
</body>
</html>
