<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <main class="center-wrapper">
    <div class="box box-px">
      <h3>Fixed Pixel Box</h3>
      <p>300px width, 200px height</p>
    </div>

    <div class="box box-percent">
      <h3>Percentage & Min-Height Box</h3>
      <p>Width: 80%, Max-Width: 400px, Min-Height: 25vh</p>
    </div>

    <div class="box box-overflow">
      <h3>Overflow Box (em & vh)</h3>
      <p>Width: 20em, Height: 20vh. This box has extra content that overflows. Overflow property handles clipping or scrollbars automatically.</p>
    </div>
  </main>
</body>
</html>
