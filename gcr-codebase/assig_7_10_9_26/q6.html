<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main class="transform-container">
    <div class="card-wrapper">
      <div class="box rotate-box">Rotate</div>
      <p class="label">rotate(45deg)</p>
    </div>

    <div class="card-wrapper">
      <div class="box scale-box">Scale</div>
      <p class="label">scale(1.2)</p>
    </div>

    <div class="card-wrapper">
      <div class="box translate-box">Translate</div>
      <p class="label">translateY(-15px)</p>
    </div>

    <div class="card-wrapper">
      <div class="box skew-box">Skew</div>
      <p class="label">skew(15deg, 10deg)</p>
    </div>
  </main>
</body>
</html>
