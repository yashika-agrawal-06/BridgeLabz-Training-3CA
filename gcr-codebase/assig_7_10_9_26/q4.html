<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadows and Depth Effect</title>
  <link rel="stylesheet" href="q4.css">
</head>
<body>
  <main class="card-grid">
    <div class="card card-1">
      <h2 class="shadow-heading">Soft Shadow</h2>
      <p>Basic subtle elevation effect using a soft box-shadow blur.</p>
    </div>

    <div class="card card-2">
      <h2 class="shadow-heading">Layered Depth</h2>
      <p>Medium depth elevation with pronounced drop shadow.</p>
    </div>

    <div class="card card-3">
      <h2 class="shadow-heading">High Contrast</h2>
      <p>Deep box-shadow effect giving maximum depth visibility.</p>
    </div>
  </main>
</body>
</html>
