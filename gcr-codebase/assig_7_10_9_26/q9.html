<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="q9.css">
</head>
<body>
  <main class="form-wrapper">
    <form class="styled-form">
      <h2>Contact Us</h2>

      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" class="input-field" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="text" id="email" class="input-field offset-outline" placeholder="Enter your email address">
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" class="input-field" rows="4" placeholder="Enter your message"></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </main>
</body>
</html>
