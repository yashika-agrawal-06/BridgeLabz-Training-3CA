<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Selectors Demonstration</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <div class="container">
    <h2>Advanced Selectors Showcase</h2>
    
    <div class="form-group">
      <input type="text" placeholder="Attribute selector target">
    </div>

    <ul class="link-list">
      <li><a href="https://example.com">Secure Link (HTTPS)</a></li>
      <li><a href="http://example.com">Normal Link (HTTP)</a></li>
      <li><a href="https://google.com">Another Secure Link</a></li>
    </ul>

    <div class="parent">
      <p class="child">Direct Child Paragraph</p>
      <div>
        <p>Descendant Paragraph</p>
      </div>
      <p class="sibling-head">Sibling Base</p>
      <p>Adjacent Sibling Paragraph</p>
      <p>General Sibling Paragraph</p>
    </div>
  </div>
</body>
</html>
