<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main>
        <header><p>Small details, lasting memories</p><h1>Moments</h1></header>
        <section class="gallery" aria-label="Photo gallery">
            <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape"><figcaption>Open roads</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest"><figcaption>Quiet woods</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1507527840605-4c0f3f1f2e48?auto=format&fit=crop&w=900&q=80" alt="Ocean waves on a beach"><figcaption>Blue hour</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Green valley and mountains"><figcaption>New paths</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks"><figcaption>Higher ground</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=900&q=80" alt="Aerial view of a green valley"><figcaption>Far horizons</figcaption></figure>
        </section>
    </main>
</body>
</html>
