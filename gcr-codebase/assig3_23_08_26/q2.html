<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

            <th colspan="5">Available Products</th>
        </tr>

            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>

        <tr>

            <td>speaker</td>

        <tr>
            <td><img src="pngwing.com.png"width=10% height=10% alt="mixer"></td>
            <td>mixer</td>

    </table>

</html>
