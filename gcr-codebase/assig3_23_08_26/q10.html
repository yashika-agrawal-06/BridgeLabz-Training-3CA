<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>
    <h1>Select Your Tourist Preference</h1>
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="india" selected>India</option>
            <option value="uk">UK</option>
        </select><br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="maharashtra">Maharashtra</option>
            <option value="up" selected>Uttar Pradesh</option>
            <option value="karnataka">Karnataka</option>
        </select><br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="agra">Agra</option>
            <option value="mathura" selected>Mathura</option>
            <option value="varanasi">Varanasi</option>
        </select><br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="taj">Taj Mahal</option>
            <option value="bankey_bihari" selected>Bankey Bihari Temple</option>
            <option value="fort">Agra Fort</option>
        </select>
    </form>

    <p>Summary: You have selected India, Uttar Pradesh,  as your preferred destinations.</p>
</body>
</html>
