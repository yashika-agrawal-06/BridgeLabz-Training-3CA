<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emphasized Formatting</title>
</head>
<body>
    <h1>Emphasis Example</h1>
    <!-- Paragraph combining strong and em elements -->
    <p>It is a <strong>rainy day</strong>today, perfect for having <em>tea and biscuits</em> would you like some?</p>
</body>
</html>
