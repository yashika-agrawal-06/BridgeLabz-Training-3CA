<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockquote and Citation</title>
</head>
<body>
    <h1>Inspirational Quote</h1>
    <!-- Blockquote with cite tag for author -->
    <blockquote>
        "The only way to do great work is to love what you do."
    </blockquote>
    <p>— <cite>Steve Jobs</cite></p>
</body>
</html>
